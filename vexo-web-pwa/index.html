<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VEXO Central</title><style>*{box-sizing:border-box}body{margin:0;overflow-x:hidden;background:#080b12;color:white;font:15px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;height:44px;position:relative}b{color:#fbbf24}.dots{display:flex;gap:6px;position:absolute;left:50%;transform:translateX(-50%);align-items:center;justify-content:center;pointer-events:none}.dot{display:block;width:5px;height:5px;border-radius:50%;background:#454b56}.dot.on{background:#fbbf24}iframe{width:100%;height:calc(100dvh - 44px);border:0;display:block}iframe[hidden]{display:none}</style><header><b>VEXO</b><div class="dots" role="img" aria-label="Página 1 de 5: Corridas"><i class="dot on"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div></header><iframe id="generator" title="Corridas" src="mobile-original.html"></iframe><iframe id="driver" title="Driver" hidden></iframe><iframe id="fuel" title="Fuel" hidden></iframe><iframe id="finance" title="Finance" hidden></iframe><iframe id="aura" title="Aura Sync" hidden></iframe><script>
(()=>{'use strict';
const frames=[...document.querySelectorAll('iframe')],dots=[...document.querySelectorAll('.dot')],indicator=document.querySelector('.dots');
let active=0;
const bound=new WeakSet();
function go(next){if(!Number.isInteger(next)||next<0||next>=frames.length||next===active)return false;
const direction=next>active?1:-1;active=next;
frames.forEach((f,i)=>{f.hidden=i!==active;if(!f.hidden&&!f.getAttribute('src'))f.src=f.id+'.html';});
dots.forEach((d,i)=>d.classList.toggle('on',i===active));
indicator.setAttribute('aria-label','Página '+(active+1)+' de '+frames.length+': '+frames[active].title);
if(frames[active].animate&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches)frames[active].animate([{transform:'translateX('+(direction*24)+'px)',opacity:.8},{transform:'translateX(0)',opacity:1}],{duration:180,easing:'ease-out'});
return true;}
function bind(doc,isActive){if(!doc||bound.has(doc))return;bound.add(doc);let start=null;
function blocked(el){if(!el||!el.closest)return false;if(el.closest('input,select,textarea,[contenteditable=true],canvas'))return true;for(let n=el;n&&n!==doc.body&&n!==doc.documentElement;n=n.parentElement){const css=doc.defaultView.getComputedStyle(n);if(/auto|scroll/.test(css.overflowX)&&n.scrollWidth>n.clientWidth+4)return true;}return false;}
doc.addEventListener('touchstart',e=>{start=null;if(!isActive()||e.touches.length!==1||blocked(e.target))return;const t=e.touches[0];start={x:t.clientX,y:t.clientY,time:Date.now()};},{passive:true});
doc.addEventListener('touchmove',e=>{if(!start)return;if(e.touches.length!==1){start=null;return;}const t=e.touches[0];if(Math.abs(t.clientY-start.y)>20&&Math.abs(t.clientY-start.y)>Math.abs(t.clientX-start.x))start=null;},{passive:true});
doc.addEventListener('touchcancel',()=>{start=null;},{passive:true});
doc.addEventListener('touchend',e=>{const s=start;start=null;if(!s||!isActive()||e.touches.length||!e.changedTouches.length)return;const t=e.changedTouches[0],dx=t.clientX-s.x,dy=t.clientY-s.y;if(Math.abs(dx)>=55&&Math.abs(dx)>1.6*Math.abs(dy)&&Date.now()-s.time<1000){if(go(active+(dx<0?1:-1))&&e.cancelable)e.preventDefault();}},{passive:false});
doc.addEventListener('keydown',e=>{if(!isActive()||!e.altKey||blocked(e.target))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){if(go(active+(e.key==='ArrowRight'?1:-1)))e.preventDefault();}});
}
bind(document,()=>true);
frames.forEach((f,i)=>{const attach=()=>{try{bind(f.contentDocument,()=>active===i);}catch(e){console.warn('Navegação lateral indisponível neste painel.',e);}};f.addEventListener('load',attach);attach();});
})();
</script></html>
