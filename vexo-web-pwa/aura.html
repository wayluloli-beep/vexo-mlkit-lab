<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aura Sync</title><style>
:root{color-scheme:dark;--bg:#080b12;--card:#171e2a;--line:#263247;--ink:#f1f5f9;--muted:#94a3b8;--cyan:#8adce8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}main{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:740px;margin:auto;padding:12px 14px max(10px,env(safe-area-inset-bottom));gap:10px}header{display:flex;align-items:center;gap:12px;flex:none}h1{font-size:19px;margin:0;letter-spacing:-.4px}small{color:var(--muted)}.orb{width:48px;height:48px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bcecf2,#498ca5 27%,#283e56 54%,#141c29 75%);box-shadow:0 0 0 1px #314454,0 3px 18px #0005;border:0}.orb.active{animation:pulse 1.5s infinite alternate}@keyframes pulse{to{box-shadow:0 0 0 4px #8adce828,0 0 18px #8adce840}}#status{font-size:12px;color:var(--muted)}#thread{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:14px;padding:10px 0;overscroll-behavior:contain}.msg{max-width:94%;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#222b39;border:1px solid #303a4c;padding:10px 13px;border-radius:18px 18px 4px 18px}.aura{align-self:flex-start;padding:4px 4px 6px}.source{display:block;margin-top:5px;color:var(--muted);font-size:11px}.quick{display:flex;gap:8px;flex-wrap:wrap}.quick button{font-size:13px;min-height:44px;padding:8px 12px;border-radius:20px}button{min-height:48px;min-width:48px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font:inherit}button:disabled{opacity:.5}button:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan)}form{display:flex;gap:8px;align-items:flex-end;background:#171e2a;border:1px solid #263247;padding:5px;border-radius:23px}textarea{flex:1;min-width:0;min-height:48px;max-height:100px;resize:none;padding:13px 8px;border:0;outline:none;background:transparent;color:var(--ink);font:inherit}#send{background:#b9e5ed;color:#12212a;border:0;font-weight:700}#voice{margin-left:auto;min-width:48px}#mic svg,#send svg,#voice svg{width:20px;height:20px;vertical-align:middle}#mic,#voice{background:transparent}#note{font-size:11px;color:var(--muted);text-align:center;margin:0} @media(prefers-reduced-motion:reduce){.orb.active{animation:none}}</style></head><body><main><header><button class="orb" id="orb" aria-label="Ouvir ou parar voz"></button><div><h1>Aura Sync</h1><div id="status" role="status">Copiloto · dados do VEXO</div></div><button id="voice" aria-label="Ativar respostas por voz" title="Voz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9v6h4l5 4V5L7 9H3zm13-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button></header><div id="thread" role="log" aria-live="polite"></div><div class="quick"><button data-q="Quanto ganhei hoje?">Ganhos de hoje</button><button data-q="Qual meu plano de ação hoje?">Plano de ação</button><button data-q="Qual o custo por km?">Custo/km</button></div><form id="form"><button type="button" id="mic" aria-label="Falar com a Aura"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3m-4 0h8"/></svg></button><textarea id="question" rows="1" maxlength="600" placeholder="Pergunte à Aura..." aria-label="Sua pergunta" required></textarea><button id="send" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></form><p id="note">Respostas baseadas nos registros disponíveis. Não aceita nem cancela corridas.</p></main><script src="data.js"></script><script src="aura-core.js"></script><script src="aura.js"></script></body></html>
