<!doctype html><html lang="pt-BR"><head><script defer src="settings.js"></script><script src="data.js"></script><link rel="stylesheet" href="responsive.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VEXO Web</title><style>:root{color-scheme:dark;--bg:#06080f;--card:#111827;--edge:#253044;--muted:#a5b4c8;--gold:#fbbf24;--green:#34d399}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1f5f9;font:15px system-ui,sans-serif}main{max-width:1000px;padding:20px;margin:auto}h1{font-size:24px;margin:0 0 8px}h2{font-size:17px}p,small{color:var(--muted);line-height:1.5}.card{padding:18px;background:var(--card);border:1px solid var(--edge);border-radius:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px}.metric{background:#0c1017;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}.metric span{color:var(--muted);font-size:12px}.metric strong{font-size:23px;font-variant-numeric:tabular-nums}.big{font-size:46px;font-weight:750;letter-spacing:-2px;margin:8px 0}.gold{color:var(--gold)}.green{color:var(--green)}.actions{display:grid;gap:10px;margin-top:16px}button{min-height:48px;border:1px solid var(--edge);background:#1e293b;color:#fff;border-radius:12px;padding:12px;font-weight:700;font-size:15px;cursor:pointer}button.primary{background:var(--gold);color:#111827;border:0}button:disabled{opacity:.5;cursor:not-allowed}.error{color:#fca5a5;white-space:pre-wrap}#status{font-size:12px;color:#a5b4c8}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 6px;text-align:left;border-bottom:1px solid var(--edge)}th{color:var(--muted)}.scroll{overflow:auto}</style></head><body><main style="max-width:480px"><small>LABORATÓRIO ESPELHADO · CORRIDAS SIMULADAS</small><h1>Radar de corridas</h1><div id="status" role="status">Conectando...</div><p id="error" class="error" role="alert"></p><section class="card" id="offer"><p>Buscando dados da base...</p></section><section class="card"><h2>Seu dia de teste</h2><div class="grid" id="summary"></div><p>Somente corridas finalizadas neste ambiente web.</p></section></main><script>const el=id=>document.getElementById(id),money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),num=(n,d=1)=>Number(n).toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:d});let busy=false,state=null;const status=t=>el('status').textContent=t;function rpc(action){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);const r=Vexo.run.withSuccessHandler(s=>{busy=false;state=s;el('error').textContent='';status('Sincronizado · '+new Date().toLocaleTimeString('pt-BR'));render(s)}).withFailureHandler(e=>{busy=false;el('error').textContent=e.message||String(e);status('Falha de sincronização');if(state)render(state);});if(action)r.webAction(action,state?.ride?.id||'');else r.webState();}function begin(){if(typeof Vexo==='undefined'){status('Abra pelo link publicado do VEXO Web.');return;}rpc();setInterval(()=>{if(!document.hidden)rpc()},5000);}const metric=(label,value)=>'<div class="metric"><span>'+label+'</span><strong>'+value+'</strong></div>';function render(s){const r=s.ride;const st={offer:'Nova oferta',accepted:'Corrida em andamento',finished:'Finalizada e registrada',rejected:'Recusada', 'saving-finish':'Finalização pendente', 'saving-reject':'Recusa pendente'};let out='';if(r){out='<small>'+st[r.status]+' · '+r.app+'</small><div class="big">'+money(r.gross)+'</div><div class="grid">'+metric('Distância total',num(r.km)+' km')+metric('Tempo total',r.min+' min')+metric('Bruto por km',money(r.gross/r.km))+metric('Bruto por hora',money(r.gross/r.min*60))+metric('Combustível estimado',money(r.fuel))+metric('Reserva manutenção',money(r.reserve))+metric('Parcela fixa estimada',money(r.fixed))+metric('Resultado estimado',money(r.profit))+'</div><p>Embarque '+num(r.pickupKm)+' km · '+r.pickupMin+' min<br>Viagem '+num(r.tripKm)+' km · '+r.tripMin+' min<br>Nota '+num(r.rating,1)+'</p>';}else out='<h2>Nenhuma oferta ativa</h2><p>Gere uma corrida para iniciar o teste.</p>';const btn=(a,t,primary)=>'<button class="'+(primary?'primary':'')+'" data-action="'+a+'">'+t+'</button>';out+='<div class="actions">'+(!r||['finished','rejected'].includes(r.status)?btn('new','Nova corrida',true):r.status==='offer'?btn('accept','Aceitar corrida',true)+btn('reject','Recusar',false):['accepted','saving-finish'].includes(r.status)?btn('finish','Finalizar corrida',true):btn('reject','Confirmar recusa',true))+'</div><p>Estimativa local: média ponderada de '+s.rates.cycles+' ciclos completos, reserva Finance e parcela fixa do Painel. A corrida aceita congela o orçamento. Sem ciclos completos, usa os parâmetros de teste.</p>';el('offer').innerHTML=out;el('summary').innerHTML=metric('Finalizadas',s.summary.count)+metric('Receita',money(s.summary.gross))+metric('Resultado estimado',money(s.summary.profit))+metric('Km simulados',num(s.summary.km));}document.getElementById("offer").addEventListener("click",e=>{const b=e.target.closest("button[data-action]");if(b)rpc(b.dataset.action)});begin();</script></body></html>
