<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VEXO Central</title><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:white;font:15px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;height:72px}b{color:#fbbf24}nav{display:flex;gap:6px;margin-left:auto}button{min-height:44px;padding:10px 16px;border:1px solid #263247;border-radius:12px;background:#111827;color:white;cursor:pointer}button[aria-selected=true]{background:#fbbf24;color:#111827}iframe{width:100%;height:calc(100dvh - 72px);border:0;display:block}iframe[hidden]{display:none}@media(max-width:600px){header{height:110px;flex-wrap:wrap}nav{width:100%;margin:0}button{flex:1;padding:8px 4px}iframe{height:calc(100dvh - 110px)}}</style><header><b>VEXO</b><nav><button data-page="generator" aria-selected="true">Corridas</button><button data-page="driver">Driver</button><button data-page="fuel">Fuel</button><button data-page="finance">Finance</button></nav></header><iframe id="generator" title="Corridas" src="mobile-original.html"></iframe><iframe id="driver" title="Driver" hidden></iframe><iframe id="fuel" title="Fuel" hidden></iframe><iframe id="finance" title="Finance" hidden></iframe><script>document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));document.querySelectorAll('iframe').forEach(f=>{f.hidden=f.id!==b.dataset.page;if(!f.hidden&&!f.getAttribute('src'))f.src=f.id+'.html'})};</script></html>
