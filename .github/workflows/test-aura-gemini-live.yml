name: Aura v3 - contrato de historico
on:
  push:
    branches: [test/vexo-aura-gemini-20261125]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verificar revisao e consultas sem dados pessoais
        run: |
          node --input-type=module <<'JS'
          const base='https://vexo-aura-flash-bridge-xs69.onrender.com';
          const h=await fetch(base+'/health',{signal:AbortSignal.timeout(50000)}).then(r=>r.json());
          console.log('Revision:',h.revision);if(h.revision!=='aura-query-v3'||!h.keyConfigured)process.exit(1);
          const cases=[['Quais horários foram feitos as corridas?','list'],['Quais informações você tem acesso das corridas?','capabilities'],['Qual foi a corrida mais cara?','max']];
          let passed=0;
          for(const [question,operation] of cases){
            const t=Date.now();
            try{
              const r=await fetch(base+'/aura/v3',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,protocol:3,context:null}),signal:AbortSignal.timeout(31000)});
              const b=await r.json();if(!r.ok)throw Error('HTTP '+r.status+' '+b.error);
              const p=JSON.parse(b.text);if(b.protocol!==3||p.intent!=='registros'||p.record?.operation!==operation)throw Error('Contrato '+JSON.stringify(p));
              if(operation==='list'&&!p.record.fields.includes('inicio'))throw Error('Campo inicio ausente');
              if(operation==='max'&&p.record.sort!=='valor')throw Error('Ordenacao incorreta');
              passed++;console.log('PASS',operation,b.model,Date.now()-t,'ms');
            }catch(e){console.log('FAIL',operation,e.message)}
          }
          console.log('RESULT',passed,'/',cases.length);
          if(passed!==cases.length)process.exitCode=1;
          JS
