name: S13 V2 masked Pop replay
'on':
  create:
permissions:
  contents: read
jobs:
  replay:
    if: ${{ github.event.ref_type == 'branch' && github.event.ref == 'vexo-s13-v2-ci-once' && github.run_attempt == '1' && github.event.repository.private == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout one exact revision
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify, assemble and run the masked replay
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          umask 077
          stage=SOURCE
          report() { printf 'C14:%s\n' "$1"; }
          work=$(mktemp -d "$RUNNER_TEMP/vexo-s13.XXXXXXXX")
          emulator_pid=''
          adb=''
          cleanup() {
            rc=$?
            if [[ -n $emulator_pid ]]; then kill "$emulator_pid" 2>/dev/null || true; fi
            if [[ -n $adb ]]; then timeout 10s "$adb" kill-server >/dev/null 2>&1 || true; fi
            rm -rf -- "$work"
            if (( rc != 0 )); then report "FAILED_$stage"; fi
          }
          trap cleanup EXIT

          [[ $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          [[ $GITHUB_REF == refs/heads/vexo-s13-v2-ci-once ]]
          printf '%s\n' \
            'e2d01fcfc00b124774720ae6e4c434d30ec5669ab3895d1458c11cbdd970726c  ci/s13-v2.sha256' \
            'a9d033c99e69e4c8b9d4a2488a93c3b7c81d4587fbbe5d32bcbd3384111d62e5  ci/verify-manifest.py' \
            | sha256sum --strict --check --status
          sha256sum --strict --check --status ci/s13-v2.sha256
          [[ $(wc -l < ci/s13-v2.sha256) == 17 ]]
          {
            cut -c67- ci/s13-v2.sha256
            printf '%s\n' '.github/workflows/s13-v2-private-once.yml' 'ci/s13-v2.sha256' 'ci/verify-manifest.py'
          } | sort > "$work/expected-tree"
          git ls-tree --full-tree -r --name-only HEAD | sort > "$work/actual-tree"
          cmp --silent "$work/expected-tree" "$work/actual-tree"
          git ls-tree --full-tree -r HEAD | awk '$1 != "100644" || $2 != "blob" {bad=1} END {exit bad}'
          git diff --quiet HEAD --
          report "SOURCE_OK:$GITHUB_SHA"

          stage=KVM
          sdk=${ANDROID_HOME:?}
          emulator="$sdk/emulator/emulator"
          [[ -c /dev/kvm && -x $emulator ]]
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then sudo -n setfacl -m "u:$(id -u):rw" /dev/kvm; fi
          [[ -r /dev/kvm && -w /dev/kvm ]]
          "$emulator" -accel-check > "$work/kvm" 2>&1
          grep -Eiq 'KVM .*installed and usable' "$work/kvm"
          report KVM_OK

          stage=TOOLS
          export JAVA_HOME=${JAVA_HOME_17_X64:?}
          export PATH="$JAVA_HOME/bin:$PATH"
          export GRADLE_USER_HOME="$work/gradle-home" ANDROID_USER_HOME="$work/android-home" ANDROID_AVD_HOME="$work/avd"
          mkdir -p "$GRADLE_USER_HOME" "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          unset ADB_SERVER_SOCKET ANDROID_ADB_SERVER_PORT ANDROID_ADB_SERVER_ADDRESS ANDROID_SERIAL
          cmdline="$sdk/cmdline-tools/latest/bin"
          if [[ ! -x $cmdline/sdkmanager ]]; then cmdline="$sdk/cmdline-tools/12.0/bin"; fi
          adb="$sdk/platform-tools/adb"
          signer="$sdk/build-tools/35.0.0/apksigner"
          analyzer="$cmdline/apkanalyzer"
          image='system-images;android-35;google_apis;x86_64'
          [[ -x $adb && -x $signer && -x $analyzer && -f $sdk/platforms/android-35/android.jar ]]
          if [[ ! -f $sdk/system-images/android-35/google_apis/x86_64/package.xml ]]; then
            timeout 300s "$cmdline/sdkmanager" --sdk_root="$sdk" "$image" > "$work/sdk.log" 2>&1
          fi
          curl --fail --location --silent --show-error --max-time 180 \
            'https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip' -o "$work/gradle.zip"
          printf 'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  %s\n' "$work/gradle.zip" | sha256sum --strict --check --status
          unzip -q "$work/gradle.zip" -d "$work"
          report TOOLS_OK

          stage=SIGNING_CONFIG
          mkdir "$work/project" "$work/private"
          git archive HEAD -- app gradle.properties settings.gradle.kts | tar -xf - -C "$work/project"
          (cd "$work/project" && sha256sum --strict --check --status "$GITHUB_WORKSPACE/ci/s13-v2.sha256")
          keytool -genkeypair -noprompt -storetype JKS -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=Disposable S13 Replay' -alias androiddebugkey -keystore "$work/private/debug.keystore" \
            -storepass android -keypass android > "$work/sign.log" 2>&1
          python3 - "$work/project/app/build.gradle.kts" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          src = p.read_text()
          old = '        getByName("debug") { signingConfig = null }'
          assert src.count(old) == 1
          p.write_text(src.replace(old, '''        getByName("debug") {
              signingConfig = signingConfigs.getByName("debug").apply {
                  storeFile = rootProject.file("../private/debug.keystore")
              }
          }''') + '''
          configurations.configureEach {
              if (name == "debugAndroidTestCompileClasspath") {
                  resolutionStrategy.force(
                      "androidx.core:core-ktx:1.9.0",
                      "androidx.arch.core:core-runtime:2.1.0",
                  )
              }
          }
          ''')
          PY
          gradle=("$work/gradle-8.11.1/bin/gradle" --project-dir "$work/project" --no-daemon --console=plain --max-workers=2)
          stage=BUILD
          timeout 180s "${gradle[@]}" --dry-run :app:assembleDebug :app:assembleDebugAndroidTest > "$work/graph.log" 2>&1
          grep -Fxq ':app:assembleDebugAndroidTest SKIPPED' "$work/graph.log"
          grep -Fxq ':app:assembleDebug SKIPPED' "$work/graph.log"
          ! grep -Eiq '^:[^ ]*(connected|release|install|device|adb|upload|publish|signingreport)' "$work/graph.log" || exit 1
          timeout 540s "${gradle[@]}" :app:assembleDebug :app:assembleDebugAndroidTest > "$work/build.log" 2>&1
          rm -f -- "$work/private/debug.keystore"
          mapfile -t targets < <(find "$work/project/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk')
          mapfile -t tests < <(find "$work/project/app/build/outputs/apk/androidTest/debug" -maxdepth 1 -type f -name '*.apk')
          [[ ${#targets[@]} == 1 && ${#tests[@]} == 1 ]]
          sha256sum --strict --check --status ci/s13-v2.sha256
          report BUILD_OK

          stage=MANIFEST
          "$analyzer" manifest print "${targets[0]}" > "$work/target.xml"
          python3 ci/verify-manifest.py "$work/target.xml" > "$work/manifest.log" 2>&1
          "$analyzer" manifest print "${tests[0]}" > "$work/test.xml"
          python3 - "$work/test.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          a = '{http://schemas.android.com/apk/res/android}'
          rows = root.findall('instrumentation')
          assert root.attrib['package'] == 'com.trackingracing.replay.test'
          assert len(rows) == 1
          assert rows[0].get(a + 'targetPackage') == 'com.trackingracing.replay'
          assert rows[0].get(a + 'name') == 'com.trackingracing.replay.ReplaySmokeInstrumentation'
          PY
          zipinfo -1 "${targets[0]}" | awk '$0 == "assets/demo-pop-sanitized.jpg" {n++} END {exit n!=1}'
          jpeg=$(unzip -p "${targets[0]}" assets/demo-pop-sanitized.jpg | sha256sum)
          [[ ${jpeg%% *} == 561bfae99f4cf7a1414a895efc799e96a9bc8ea84cef09e858759b14eab4728b ]]
          report MANIFESTS_AND_MASKED_FIXTURE_OK

          stage=SIGNATURE_VERIFY
          check_sig() {
            cp -- "$1" "$work/$2.apk"
            "$signer" verify --min-sdk-version 35 --max-sdk-version 35 --print-certs "$work/$2.apk" > "$work/$2.certs" 2>&1
            [[ $(grep -cE '^Signer #[0-9]+ certificate SHA-256 digest: ' "$work/$2.certs") == 1 ]]
          }
          check_sig "${targets[0]}" target
          check_sig "${tests[0]}" test
          certificate() { sed -n 's/^Signer #1 certificate SHA-256 digest: \([0-9a-f]\{64\}\)$/\1/p' "$work/$1.certs"; }
          cert=$(certificate target)
          [[ ${#cert} == 64 && $cert == "$(certificate test)" ]]
          report "DISPOSABLE_CERT_SHA256:$cert"
          for role in target test; do
            digest=$(sha256sum "$work/$role.apk")
            report "APK_SHA256:${role}:${digest%% *}"
          done

          stage=BOOT
          serial=emulator-5554
          transports() { timeout 9s "$adb" devices | awk 'NR>1 && NF {print $1 " " $2}'; }
          device() {
            local rows
            rows=$(transports) || return 1
            [[ $rows == "$serial device" ]] || return 1
            timeout 60s "$adb" -s "$serial" "$@"
          }
          rows=$(transports) || exit 1
          [[ -z $rows ]]
          printf 'no\n' | timeout 45s "$cmdline/avdmanager" create avd -n vexo_s13_once -k "$image" > "$work/avd.log" 2>&1
          "$emulator" -avd vexo_s13_once -port 5554 -accel on -gpu swiftshader_indirect \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data > "$work/emulator.log" 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS + 210))
          boot=''
          while (( SECONDS < deadline )); do
            kill -0 "$emulator_pid"
            rows=$(transports) || exit 1
            case $rows in
              '') ;;
              "$serial offline") ;;
              "$serial device")
                boot=$(device shell getprop sys.boot_completed | tr -d '\r') || boot=''
                if [[ $boot == 1 ]]; then break; fi
                ;;
              *) exit 1 ;;
            esac
            sleep 2
          done
          [[ $boot == 1 ]]
          [[ $(device shell getprop ro.build.version.sdk | tr -d '\r') == 35 ]]
          [[ $(device shell getprop ro.product.cpu.abi | tr -d '\r') == x86_64 ]]
          pm_ready=''
          for attempt in {1..12}; do
            if device shell cmd package path android > "$work/boot-pm.log" 2>&1 && grep -q '^package:' "$work/boot-pm.log"; then
              pm_ready=1
              break
            fi
            sleep 2
          done
          [[ $pm_ready == 1 ]]
          device shell wm dismiss-keyguard > "$work/keyguard.log" 2>&1
          report BOOT_API35_X86_64_OK

          stage=INSTALL
          for role in target test; do device install --no-streaming "$work/$role.apk" > "$work/$role.install" 2>&1; done
          for role in target test; do grep -Fxq Success "$work/$role.install"; done
          device shell pm list instrumentation > "$work/device-runner" 2>&1
          runner='com.trackingracing.replay.test/com.trackingracing.replay.ReplaySmokeInstrumentation'
          tr -d '\r' < "$work/device-runner" | grep -Fxq "instrumentation:$runner (target=com.trackingracing.replay)"
          report BOTH_INSTALLED_AND_RUNNER_MATCHED

          stage=INSTRUMENTATION
          device shell am instrument -w -r "$runner" > "$work/instrumentation.raw" 2>&1
          tr -d '\r' < "$work/instrumentation.raw" > "$work/instrumentation"
          [[ $(grep -Fxc 'INSTRUMENTATION_RESULT: result=S13 replay matched S05 metrics' "$work/instrumentation") == 1 ]]
          [[ $(grep -Fxc 'INSTRUMENTATION_CODE: -1' "$work/instrumentation") == 1 ]]
          ! grep -Eiq 'INSTRUMENTATION_FAILED|shortMsg=|INSTRUMENTATION_ABORTED|Exception|Crash' "$work/instrumentation" || exit 1
          report S13_V2_MLKIT_ANDROID_VIEW_METRICS_MATCHED
