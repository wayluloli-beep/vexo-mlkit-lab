
name: Gerar APK Vexo ML Kit

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto Vexo
        run: unzip -oq Vexo_Leitor_MLKit_Projeto_Android.zip

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android 35
        run: |
          echo "SDK: $ANDROID_HOME"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vexo-MLKit-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
