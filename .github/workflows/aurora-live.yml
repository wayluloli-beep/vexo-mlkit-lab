name: Vexo R19 Android manual candidate
'on':
  create:
permissions:
  contents: read
jobs:
  r19-native:
    if: ${{ github.repository == 'wayluloli-beep/vexo-mlkit-lab' && github.event.ref_type == 'branch' && github.event.ref == 'vexo-product-r19-native-clean' && github.event.repository.private == true }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact R19 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Rebuild and test the isolated manual edition
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/vexo-r19-native"
          mkdir "$work"
          bash qa/r19/materialize.sh "$work"
          python3 qa/r19/isolate-native.py "$work/src/aurora"
          node qa/r19/ci-manual.cjs web "$work/src/aurora"
      - name: Assemble and inspect the private unsigned manual APK
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:?}"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n $sdk ]]
          mgr="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x $mgr ]]; then
            mgr=$(find "$sdk/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          fi
          [[ -x $mgr ]]
          aapt="$sdk/build-tools/35.0.0/aapt"
          packages=()
          [[ -f $sdk/platforms/android-36/android.jar ]] || packages+=('platforms;android-36')
          [[ -x $aapt ]] || packages+=('build-tools;35.0.0')
          if (( ${#packages[@]} )); then
            timeout 300s "$mgr" --sdk_root="$sdk" --install "${packages[@]}"
          fi
          work="${RUNNER_TEMP}/vexo-r19-native"
          export GRADLE_USER_HOME="$work/gradle-home"
          curl --fail --location --silent --show-error --max-time 180 'https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip' -o "$work/gradle.zip"
          printf 'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  %s\n' "$work/gradle.zip" | sha256sum --strict --check --status
          unzip -q "$work/gradle.zip" -d "$work"
          unset APK_KEYSTORE_FILE APK_STORE_PASSWORD APK_KEY_ALIAS APK_KEY_PASSWORD GITHUB_RUN_NUMBER
          gradle="$work/gradle-8.11.1/bin/gradle"
          "$gradle" --project-dir "$work/src/aurora" --no-daemon --console=plain --max-workers=2 :app:assembleRelease :app:testDebugUnitTest
          mapfile -t apks < <(find "$work/src/aurora/app/build/outputs/apk/release" -maxdepth 1 -name '*unsigned.apk')
          [[ ${#apks[@]} == 1 ]]
          python3 qa/r19/check-manual-apk.py "${apks[0]}" "$aapt" "$work/src/aurora/app/build/test-results/testDebugUnitTest"
      - name: Enforce clean Android lint separately from the APK proof
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:?}"
          export PATH="$JAVA_HOME/bin:$PATH"
          work="${RUNNER_TEMP}/vexo-r19-native"
          export GRADLE_USER_HOME="$work/gradle-home"
          status=0
          node qa/r19/ci-manual.cjs android "$work/src/aurora" "$work/gradle-8.11.1/bin/gradle" || status=$?
          if (( status != 0 )); then
            python3 qa/r19/report-lint.py "$work/src/aurora"
          fi
          exit "$status"
