name: Aura neural voice model metadata
'on':
  push:
    branches: [vexo-r21-aura-sync-voice]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    steps:
      - name: Verify neural Brazilian Portuguese female model manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          base='https://huggingface.co/api/models/litert-community/Kokoro-82M'
          req=urllib.request.Request(base+'/revision/main',headers={'User-Agent':'Vexo-R21-Metadata/1.0'})
          info=json.load(urllib.request.urlopen(req,timeout=30))
          rev=info['sha']
          files=json.load(urllib.request.urlopen(urllib.request.Request(base+'/tree/'+rev+'?recursive=true',headers={'User-Agent':'Vexo-R21-Metadata/1.0'}),timeout=40))
          for f in files:
            if f.get('path') in ('kokoro_int8_gpu_fp16.litertlm','kokoro_int8_fp16.litertlm'):
              print('AURA_MODEL_PIN',rev,f.get('path'),f.get('size'),f.get('lfs',{}).get('oid'))
          PY
