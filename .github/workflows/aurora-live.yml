name: Vexo R20 private preview APK
'on':
  push:
    branches: [vexo-r20-ocr-full]
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.repository == 'wayluloli-beep/vexo-mlkit-lab' && github.event.repository.private == true && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build and verify full R20 APK
        run: bash qa/r20/build.sh
      - name: Upload signed APK to private GitHub prerelease
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 qa/r20/publish_release.py
