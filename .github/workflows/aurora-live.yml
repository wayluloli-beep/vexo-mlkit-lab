name: Vexo R19 private screenshot gallery
'on':
  create:
permissions:
  contents: read
jobs:
  journey:
    if: ${{ github.repository == 'wayluloli-beep/vexo-mlkit-lab' && github.event.ref_type == 'branch' && github.event.ref == 'vexo-product-r19-prints' && github.event.repository.private == true }}
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 27
    steps:
      - name: Checkout test revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Capture R19 screens in an offline Android emulator
        shell: bash
        run: bash qa/r19/run-webview-smoke.sh
      - name: Retain only the synthetic PNGs on this private branch
        if: ${{ always() && github.event.repository.private == true && github.run_attempt == '1' && github.ref == 'refs/heads/vexo-product-r19-prints' }}
        timeout-minutes: 4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 qa/r19/retain-r19-prints.py
