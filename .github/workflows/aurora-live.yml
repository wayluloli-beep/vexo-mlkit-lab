name: Vexo R20 full OCR and daytime home
'on':
  push:
    branches: [vexo-r20-ocr-full]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build and test full OCR Vexo R20
        shell: bash
        run: bash qa/r20/build.sh
      - name: Save verified APK on private R20 branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('qa/r19/retain-internal-apk.py').read_text()
          for a,b in [('vexo-r19-apk-download','vexo-r20-ocr-full'),('Vexo-R19-teste.apk','Vexo-R20-teste.apk')]:
              assert a in code
              code=code.replace(a,b)
          exec(compile(code,'qa/r20/retainer.py','exec'),{'__name__':'__main__'})
          PY
