name: Vexo R19 downloadable private test APK
'on':
  create:
permissions:
  contents: read
jobs:
  apk:
    if: ${{ github.repository == 'wayluloli-beep/vexo-mlkit-lab' && github.event.ref_type == 'branch' && github.event.ref == 'vexo-r19-apk-download' && github.event.repository.private == true && github.run_attempt == '1' }}
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout the internal delivery branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Build and verify the signed side-by-side APK
        shell: bash
        run: bash qa/r19/build-internal-apk.sh
      - name: Save the verified APK as a file only on this private branch
        timeout-minutes: 4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 qa/r19/retain-internal-apk.py
