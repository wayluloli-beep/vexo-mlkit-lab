name: Vexo Aurora Product R13 private Android QA
'on':
  create:
permissions:
  contents: read
jobs:
  live-android:
    if: ${{ github.repository == 'wayluloli-beep/vexo-mlkit-lab' && github.event.ref_type == 'branch' && github.event.ref == 'vexo-product-r13-direct-once' && github.run_attempt == '1' && github.event.repository.private == true }}
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact R13 private QA revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Boot clean Android and test first entry and OCR
        timeout-minutes: 52
        shell: bash
        run: bash qa/run-live.sh
      - name: Keep validated synthetic Android prints on this private QA branch
        if: ${{ always() && github.repository == 'wayluloli-beep/vexo-mlkit-lab' && github.event.repository.private == true && github.run_attempt == '1' && github.ref == 'refs/heads/vexo-product-r13-direct-once' }}
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VEXO_EVIDENCE_DIR: ${{ runner.temp }}/vexo-live-evidence
        run: PYTHONDONTWRITEBYTECODE=1 python3 qa/retain-evidence.py
