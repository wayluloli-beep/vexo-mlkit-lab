name: Vexo Aurora Android OCR freshness R10
'on':
  create:
permissions:
  contents: read
jobs:
  live-android:
    if: ${{ github.event.ref_type == 'branch' && github.event.ref == 'vexo-live-aurora-r10-once' && github.run_attempt == '1' && github.event.repository.private == true }}
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 32
    steps:
      - name: Checkout isolated QA revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Boot accelerated Android and exercise real capture and overlay
        shell: bash
        run: bash qa/run-live.sh
      - name: Keep Android test prints and clip on this private QA branch
        if: ${{ always() && github.event.repository.private == true && github.run_attempt == '1' && github.ref == 'refs/heads/vexo-live-aurora-r10-once' }}
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VEXO_EVIDENCE_DIR: ${{ runner.temp }}/vexo-live-evidence
        run: python3 qa/retain-evidence.py
