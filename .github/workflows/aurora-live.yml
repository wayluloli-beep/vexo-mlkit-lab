name: Vexo R20 review full OCR product
'on':
  create:
  push:
    branches:
      - vexo-r20-ocr-full
permissions:
  contents: read
jobs:
  inspect:
    if: ${{ github.repository == 'wayluloli-beep/vexo-mlkit-lab' && github.ref == 'refs/heads/vexo-r20-ocr-full' && github.event.repository.private == true }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect original OCR shell and R19 navigation
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          bash qa/r19/materialize.sh "$work"
          src="$work/src/aurora"
          echo 'VEXO_R20_MANIFEST'
          cat "$src/app/src/main/AndroidManifest.xml"
          echo 'VEXO_R20_NATIVE_REFERENCES'
          grep -nE 'startExternal|warmLocalRecognizer|tick|Simulador99Activity|ScreenCaptureService|showCentral|loadUrl|openCentral|central.html|index.html|launchCentral|setContentView' "$src/app/src/main/java/com/trackingracing/AuroraActivity.kt" | head -110
          echo 'VEXO_R20_CENTRAL_JS'
          cat "$src/app/src/main/assets/aurora/central.js"
          echo 'VEXO_R20_INDEX_TOP'
          head -c 7000 "$src/app/src/main/assets/aurora/index.html"
          echo
          echo 'VEXO_R20_CENTRAL_CSS'
          head -c 3800 "$src/app/src/main/assets/aurora/central.css"
          echo
          echo 'VEXO_R20_MAIN_NATIVE_FILES'
          find "$src/app/src/main/java/com/trackingracing" -maxdepth 1 -type f -printf '%f\n' | sort
          echo 'VEXO_R20_BUILD_GRADLE'
          cat "$src/app/build.gradle.kts"
