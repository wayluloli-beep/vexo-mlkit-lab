name: Vexo R20 native bridge inspection
'on':
  push:
    branches: [vexo-r20-ocr-full]
permissions:
  contents: read
jobs:
  inspect:
    if: ${{ github.repository == 'wayluloli-beep/vexo-mlkit-lab' && github.ref == 'refs/heads/vexo-r20-ocr-full' && github.event.repository.private == true }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Native bridge and onboarding inspection
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          bash qa/r19/materialize.sh "$work" >/dev/null
          src="$work/src/aurora"
          echo 'NATIVE_PART_1'
          sed -n '1,240p' "$src/app/src/main/java/com/trackingracing/AuroraActivity.kt"
          echo 'NATIVE_PART_2'
          sed -n '280,350p' "$src/app/src/main/java/com/trackingracing/AuroraActivity.kt"
          echo 'NATIVE_PART_3'
          sed -n '420,465p' "$src/app/src/main/java/com/trackingracing/AuroraActivity.kt"
          echo 'ONBOARDING_ENTRY'
          grep -nE 'central.html|vexo.entry.sequence.x4|vexo.entry.disclosure.v1|location.replace' "$src/app/src/main/assets/aurora/onboarding.html" | head -40
