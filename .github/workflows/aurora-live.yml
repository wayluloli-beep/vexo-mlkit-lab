name: Vexo Android 16 private privacy persistence
'on':
  create:
permissions:
  contents: read
jobs:
  journey:
    if: ${{ github.repository == 'wayluloli-beep/vexo-mlkit-lab' && github.event.ref_type == 'branch' && github.event.ref == 'vexo-product-r19-privacy-qa' && github.event.repository.private == true }}
    runs-on: ubuntu-26.04
    timeout-minutes: 27
    steps:
      - name: Checkout test revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify the private offline privacy preference across restart
        shell: bash
        run: bash qa/r19/run-webview-smoke.sh
