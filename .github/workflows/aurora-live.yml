name: Vexo R21 Aura Sync neural voice preview
'on':
  push:
    branches: [vexo-r21-aura-sync-voice]
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.repository == 'wayluloli-beep/vexo-mlkit-lab' && github.event.repository.private == true && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Assemble signed APK using 20 pinned neural pt-BR audio clips
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash qa/r21/build.sh
      - name: Publish private test APK
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('qa/r20/publish_release.py').read_text()
          changes=[('vexo-r20-ocr-full','vexo-r21-aura-sync-voice'),
                   ('Vexo-R20-teste.apk','Vexo-R21-Aura-Sync.apk'),
                   ('vexo-r20-test-','vexo-r21-aura-test-'),
                   ('Vexo R20','Vexo R21'),
                   ('R20','R21')]
          for a,b in changes:
              if a not in code: raise SystemExit("R21 publish pattern absent: "+a)
              code=code.replace(a,b)
          exec(compile(code,"qa/r21/publish_release.py","exec"),{"__name__":"__main__"})
          PY
