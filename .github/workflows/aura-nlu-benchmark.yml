name: Aura NLU - quinta bateria vocabulario financeiro e uniao de datas
on:
  push:
    branches: [experiment/aura-query-engine-20261125]
concurrency:
  group: vexo-nlu-lab
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Contrato do executor
        run: node vexo-web-pwa/test-aura-query-engine.cjs
      - name: Rodar 15 casos e 9 turnos reais
        run: |
          node --input-type=module <<'JS'
          const base='https://vexo-aura-flash-bridge-xs69.onrender.com';
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          let ready=false;
          for(let i=0;i<20;i++){try{const h=await fetch(base+'/health',{signal:AbortSignal.timeout(10000)}).then(r=>r.json());if(h.revision==='aura-query-v3.1-nlu-round5'&&h.keyConfigured){ready=true;break}}catch{}await pause(3000);}
          if(!ready)throw Error('Laboratorio nao publicado');
          const rows=[];
          async function request(path,timeout){for(let i=0;i<30;i++){try{const r=await fetch(base+path,{method:'POST',signal:AbortSignal.timeout(timeout)});const d=await r.json();if(r.status===429&&d.error==='lab_busy'&&i<29){console.log('LAB_BUSY_WAIT',path,i+1);await pause(5000);continue;}return {...d,http:r.status,lab_busy_waits:i};}catch(e){return {pass:false,error:e.name,lab_busy_waits:i};}}}
          for(let i=1;i<=15;i++){const d=await request('/aura/nlu-round5/case/'+i,75000);rows.push({group:'baseline',...d});console.log('BASELINE',i,JSON.stringify(d));await pause(350);}
          let sessions=0;
          for(const name of ['A','B','C']){const d=await request('/aura/nlu-round5/session/'+name,220000);if(d.pass)sessions++;for(const t of d.turns||[]){rows.push({group:'stateful',session:name,...t});console.log('TURN',name,t.turn,JSON.stringify(t));}console.log('SESSION_RESULT',name,d.pass===true,JSON.stringify(d.turns?{turns:d.turns.length}:{error:d.error,http:d.http}));await pause(350);}
          function summarize(a){return {observed:a.length,passed:a.filter(d=>d.pass).length,semantic_errors:a.filter(d=>['invalid_json','invalid_schema','semantic_mismatch'].includes(d.error)).length,transport_errors:a.filter(d=>!d.pass&&!['invalid_json','invalid_schema','semantic_mismatch'].includes(d.error)).length,retries:a.reduce((s,d)=>s+(d.retry_count||0),0),upstream_attempts:a.reduce((s,d)=>s+(d.attempts?.length||0),0),first_attempt_passes:a.filter(d=>d.pass&&d.retry_count===0).length,network_ms:a.filter(d=>d.pass).map(d=>d.network_latency_ms),total_ms:a.filter(d=>d.pass).map(d=>d.total_elapsed_with_retries_ms),output_tokens:a.filter(d=>d.pass).map(d=>d.output_tokens),thinking_tokens:a.filter(d=>d.pass).map(d=>d.thinking_tokens)};}
          console.log('ROUND5_RESULT',JSON.stringify({baseline:summarize(rows.filter(d=>d.group==='baseline')),stateful:summarize(rows.filter(d=>d.group==='stateful')),sessions}));
          if(rows.filter(d=>d.pass).length!==24||sessions!==3)process.exitCode=1;
          JS
