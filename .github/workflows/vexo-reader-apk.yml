name: Vexo Reader - APK standalone

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'reader-standalone/**'
      - '.github/workflows/vexo-reader-apk.yml'

permissions:
  contents: read

jobs:
  build-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and build experimental APK
        run: gradle --no-daemon -p reader-standalone :app:testDebugUnitTest :app:assembleDebug
      - name: Compute SHA256
        run: |
          cd reader-standalone
          sha256sum app/build/outputs/apk/debug/app-debug.apk > APK_SHA256.txt
          echo "Git commit: $GITHUB_SHA" >> APK_SHA256.txt
      - name: Upload Vexo Reader APK
        uses: actions/upload-artifact@v4
        with:
          name: Vexo-Reader-Standalone-debug
          path: |
            reader-standalone/app/build/outputs/apk/debug/app-debug.apk
            reader-standalone/APK_SHA256.txt
          if-no-files-found: error
          retention-days: 7
