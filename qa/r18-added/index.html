<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Abertura Vexo</title>
<style>
html,body{margin:0;background:#000;color:#e5f9fd;height:100%;font:16px system-ui,sans-serif}#opening{position:fixed;inset:0;display:grid;place-items:center}#opening[hidden]{display:none}video{width:100%;height:100%;object-fit:contain;pointer-events:none}.open-controls{position:absolute;inset:auto 16px max(27px,env(safe-area-inset-bottom)) auto}button{font:inherit;min-height:44px;padding:8px 14px;color:#e5f9fd;border:1px solid #437782;border-radius:12px;background:#102129}p{position:fixed;bottom:14%;left:10%;right:10%;text-align:center}
</style></head><body>
<div id="opening" hidden aria-label="Abertura Vexo"><video id="opening-video" playsinline disablepictureinpicture disableremoteplayback poster="./assets/vexo-abertura.webp" tabindex="-1" aria-hidden="true"></video><div class="open-controls"><button type="button" id="opening-continue">Ir para as boas-vindas</button></div></div>
<p id="opening-failure" role="alert" hidden>Não consegui abrir o Vexo. Feche o app e tente de novo.</p>
<script id="vexo-startup">
(() => {
  'use strict';
  const key='vexo.entry.sequence.x4', terms='vexo.entry.disclosure.v1', version='vexo-termos-minuta-2026-11-20';
  const welcome='./onboarding.html';
  let phase,accepted;
  try { phase=localStorage.getItem(key);accepted=localStorage.getItem(terms); }
  catch (_) { location.replace(welcome);return; }
  if(phase==='app'&&accepted===version){location.replace('./central.html');return;}
  if(phase!==null||accepted!==null||matchMedia('(prefers-reduced-motion: reduce)').matches){location.replace(welcome);return;}
  const opening=document.getElementById('opening'),video=document.getElementById('opening-video');
  let leaving=false,timer;
  function finish(){if(leaving)return;leaving=true;clearTimeout(timer);location.replace(welcome);}
  // Mark the onboarding in progress so an interrupted animation never forces a replay.
  try { localStorage.setItem(key,'interview'); } catch (_) { finish();return; }
  opening.hidden=false;
  window.addEventListener('vexo:android-back',finish,{once:true});
  document.getElementById('opening-continue').addEventListener('click',finish);
  video.addEventListener('ended',finish,{once:true});video.addEventListener('error',finish,{once:true});
  timer=setTimeout(finish,18000);
  video.src='./assets/vexo-abertura.mp4';
  try { video.play()?.catch(finish); } catch (_) { finish(); }
})();
</script></body></html>
