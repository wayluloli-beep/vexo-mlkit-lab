<section id="comfort-settings" aria-labelledby="comfort-title">
  <h2 id="comfort-title">Aparência e conforto</h2>
  <div class="comfort-control">
    <label class="comfort-check" for="comfort-oled">
      <input id="comfort-oled" type="checkbox" aria-describedby="comfort-oled-help">
      Preto OLED
    </label>
    <p class="detail" id="comfort-oled-help">Deixa o fundo preto puro, sem mudar os dados do turno.</p>
  </div>
  <div class="comfort-control">
    <label for="comfort-hand">Modo com uma mão</label>
    <select id="comfort-hand" aria-describedby="comfort-hand-help">
      <option value="off">Desligado</option>
      <option value="right">Mão direita</option>
      <option value="left">Mão esquerda</option>
    </select>
    <p class="detail" id="comfort-hand-help">No celular em pé, aproxima os botões principais do turno do lado que você escolher.</p>
  </div>
  <p id="comfort-status" role="status"></p>
</section>
